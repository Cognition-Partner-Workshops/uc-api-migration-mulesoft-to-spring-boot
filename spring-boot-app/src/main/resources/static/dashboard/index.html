<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Dashboard | Employee Services</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>Employee Dashboard</h1>
      <div class="employee-selector">
        <label for="employee-id">Employee ID</label>
        <input type="text" id="employee-id" value="EMP001" autocomplete="off" />
        <button id="load-btn" type="button">Load</button>
      </div>
    </div>
  </header>

  <main class="grid">
    <section class="card" id="goals-card">
      <h2>Goals</h2>
      <div class="card-body" id="goals-body">
        <p class="muted">Loading…</p>
      </div>
    </section>

    <section class="card" id="learning-card">
      <h2>Learning Progress</h2>
      <div class="card-body" id="learning-body">
        <p class="muted">Loading…</p>
      </div>
    </section>

    <section class="card" id="pay-card">
      <h2>Next Pay Date</h2>
      <div class="card-body" id="pay-body">
        <p class="muted">Loading…</p>
      </div>
    </section>

    <section class="card" id="pto-balance-card">
      <h2>PTO Balance</h2>
      <div class="card-body" id="pto-balance-body">
        <p class="muted">Loading…</p>
      </div>
    </section>

    <section class="card wide" id="pto-schedule-card">
      <h2>Schedule PTO</h2>
      <div class="card-body">
        <form id="pto-form" novalidate>
          <div class="form-row">
            <div class="form-field">
              <label for="pto-start">Start date</label>
              <input type="date" id="pto-start" required />
            </div>
            <div class="form-field">
              <label for="pto-end">End date</label>
              <input type="date" id="pto-end" required />
            </div>
            <div class="form-field">
              <label for="pto-hours">Hours</label>
              <input type="number" id="pto-hours" min="0.5" step="0.5" placeholder="e.g. 8" required />
            </div>
            <div class="form-field form-actions">
              <button type="submit" id="pto-submit">Schedule PTO</button>
            </div>
          </div>
          <div id="pto-feedback" class="feedback hidden" role="status"></div>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">Employee Services API &mdash; mock data mode</footer>

  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
