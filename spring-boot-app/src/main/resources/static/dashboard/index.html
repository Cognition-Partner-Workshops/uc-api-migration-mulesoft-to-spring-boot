<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Dashboard</title>
    <link rel="stylesheet" href="/dashboard/styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div>
          <p class="eyebrow">People operations</p>
          <h1>Employee dashboard</h1>
          <p class="header-copy">A simple view of goals, learning, pay, and time off.</p>
        </div>
        <label class="employee-picker">
          <span>Employee</span>
          <select id="employee-select" aria-label="Select employee">
            <option value="EMP001">EMP001</option>
            <option value="EMP002">EMP002</option>
          </select>
        </label>
      </div>
    </header>

    <main class="dashboard-shell">
      <div id="global-status" class="sr-only" aria-live="polite"></div>
      <section class="panel-grid" aria-label="Employee information">
        <article class="panel panel-goals">
          <div class="panel-heading">
            <div>
              <p class="panel-kicker">Focus areas</p>
              <h2>Goals</h2>
            </div>
            <span class="panel-icon">↗</span>
          </div>
          <div id="goals-content" class="panel-content"></div>
        </article>
        <article class="panel panel-learning">
          <div class="panel-heading">
            <div>
              <p class="panel-kicker">Growth</p>
              <h2>Learning progress</h2>
            </div>
            <span class="panel-icon">✦</span>
          </div>
          <div id="learning-content" class="panel-content"></div>
        </article>
        <article class="panel panel-pay">
          <div class="panel-heading">
            <div>
              <p class="panel-kicker">Payroll</p>
              <h2>Next pay date</h2>
            </div>
            <span class="panel-icon">▣</span>
          </div>
          <div id="pay-content" class="panel-content"></div>
        </article>
        <article class="panel panel-pto">
          <div class="panel-heading">
            <div>
              <p class="panel-kicker">Time away</p>
              <h2>PTO balance</h2>
            </div>
            <span class="panel-icon">◷</span>
          </div>
          <div id="pto-content" class="panel-content"></div>
        </article>
      </section>

      <section class="panel schedule-panel">
        <div class="panel-heading">
          <div>
            <p class="panel-kicker">Plan ahead</p>
            <h2>Schedule PTO</h2>
          </div>
          <span class="panel-icon">＋</span>
        </div>
        <form id="pto-form" class="pto-form">
          <label>Start date<input id="start-date" name="startDate" type="date" required></label>
          <label>End date<input id="end-date" name="endDate" type="date" required></label>
          <label>Hours<input id="hours" name="hours" type="number" min="0.5" step="0.5" placeholder="8" required></label>
          <button type="submit">Request time off</button>
        </form>
        <div id="form-message" class="form-message" aria-live="polite"></div>
      </section>
    </main>
    <script type="module" src="/dashboard/app.js"></script>
  </body>
</html>
